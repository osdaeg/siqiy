<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Siq'iy Library Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #080c10;
      --panel:     #0d1117;
      --panel2:    #111820;
      --border:    #1e2d3d;
      --accent:    #00d4ff;
      --accent2:   #ff6b35;
      --text:      #c9d1d9;
      --text-dim:  #4a5568;
      --text-bright: #e6edf3;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Rajdhani', sans-serif;
      --glow:      0 0 12px rgba(0,212,255,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--sans);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 0 20px;
      height: 50px; border-bottom: 1px solid var(--border); background: var(--panel);
      flex-shrink: 0;
    }
    .logo { font-family: var(--mono); font-size: 16px; letter-spacing: 3px; color: var(--accent); text-shadow: var(--glow); }
    .logo-sub { font-family: var(--mono); font-size: 9px; color: var(--text-dim); letter-spacing: 2px; }
    .header-sep { width: 1px; height: 26px; background: var(--border); }
    select.lib-select {
      background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      font-family: var(--mono); font-size: 11px; padding: 6px 10px; outline: none;
    }
    .hbtn {
      padding: 6px 14px; background: transparent; border: 1px solid var(--border);
      color: var(--text-dim); font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s;
    }
    .hbtn:hover { border-color: var(--accent); color: var(--accent); }
    .hbtn.primary { background: var(--accent); color: #000; border: none; font-weight: bold; }
    .hbtn.primary:hover { background: #00eeff; box-shadow: var(--glow); }
    .hbtn.primary.saved { background: #00ff88; }
    #status-msg { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Symbols sidebar ── */
    .symbols-panel {
      width: 220px; flex-shrink: 0; background: var(--panel);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
    }
    .panel-title {
      padding: 10px 14px; font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
      color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid var(--border);
    }
    .symbols-list { flex: 1; overflow-y: auto; }
    .symbols-list::-webkit-scrollbar { width: 4px; }
    .symbols-list::-webkit-scrollbar-thumb { background: var(--border); }
    .symbol-item {
      display: flex; align-items: center; gap: 8px; padding: 9px 14px;
      cursor: pointer; border-left: 2px solid transparent; font-family: var(--mono);
      font-size: 12px; color: var(--text-dim); transition: all 0.15s;
    }
    .symbol-item:hover { background: rgba(0,212,255,0.05); color: var(--text); }
    .symbol-item.active {
      background: rgba(0,212,255,0.08); border-left-color: var(--accent); color: var(--accent);
    }
    .symbols-footer { padding: 10px; border-top: 1px solid var(--border); }
    .add-btn {
      width: 100%; padding: 7px; background: transparent; border: 1px dashed var(--border);
      color: var(--text-dim); font-family: var(--mono); font-size: 10px; cursor: pointer;
      transition: all 0.2s; letter-spacing: 1px;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Symbol editor ── */
    .symbol-editor {
      width: 300px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
      overflow-y: auto; padding-bottom: 20px;
    }
    .symbol-editor::-webkit-scrollbar { width: 4px; }
    .symbol-editor::-webkit-scrollbar-thumb { background: var(--border); }
    .section { border-bottom: 1px solid var(--border); padding: 12px 14px; }
    .section-title {
      font-family: var(--mono); font-size: 9px; letter-spacing: 3px; color: var(--text-dim);
      text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between;
    }
    .field { margin-bottom: 9px; }
    .field label {
      display: block; font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      letter-spacing: 1px; margin-bottom: 3px;
    }
    .field input[type="text"], .field input[type="number"], .field select {
      width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      font-family: var(--mono); font-size: 11px; padding: 5px 7px; outline: none;
    }
    .field input[type="color"] { width: 100%; height: 28px; border: 1px solid var(--border); background: var(--panel2); padding: 2px; cursor: pointer; }
    .field-row { display: flex; gap: 6px; }
    .field-row .field { flex: 1; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .toggle-row label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); letter-spacing: 1px; cursor: pointer; }

    /* Shapes list within symbol */
    .shapes-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .shape-chip {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel2);
      border: 1px solid var(--border); cursor: pointer; font-family: var(--mono); font-size: 10px;
      color: var(--text-dim); transition: all 0.15s;
    }
    .shape-chip:hover { border-color: var(--accent); color: var(--text); }
    .shape-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.06); }
    .shape-chip .stype { color: var(--accent2); text-transform: uppercase; font-size: 9px; }
    .shape-chip .sdup { color: var(--text-dim); cursor: pointer; padding: 0 3px; margin-left: auto; }
    .shape-chip .sdup:hover { color: var(--accent); }
    .shape-chip .sremove { color: var(--text-dim); cursor: pointer; padding: 0 3px; }
    .shape-chip .sremove:hover { color: var(--accent2); }

    .shape-detail { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; }
    select.shape-type-select { width: 100%; margin-bottom: 8px; }

    /* ── Preview + YAML ── */
    .preview-yaml { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .preview-area {
      flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto;
      background: radial-gradient(circle at 30% 70%, rgba(0,212,255,0.04) 0%, transparent 50%), var(--bg);
    }
    .yaml-area { height: 220px; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .yaml-area-header {
      padding: 6px 14px; font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
      color: var(--text-dim); background: var(--panel); border-bottom: 1px solid var(--border);
    }
    #yaml-output {
      flex: 1; background: var(--panel2); border: none; color: #7ec8e3; font-family: var(--mono);
      font-size: 10.5px; line-height: 1.5; padding: 10px 14px; resize: none; outline: none; overflow-y: auto;
    }
    .empty-state {
      display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-dim);
      font-family: var(--mono); font-size: 11px; text-align: center; padding: 40px;
    }
    .spinner {
      width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.6s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">LIBRARY STUDIO</div>
    <div class="logo-sub">EDITOR DE SÍMBOLOS</div>
  </div>
  <div class="header-sep"></div>
  <select class="lib-select" id="lib-select" onchange="onLibrarySelect()"></select>
  <button class="hbtn" id="btn-new-library" onclick="newLibrary()">+ NUEVA LIBRERÍA</button>
  <div class="header-sep"></div>
  <button class="hbtn" id="btn-editor" onclick="openEditor()">✎ EDITOR</button>
  <button class="hbtn" id="btn-from-editor" onclick="loadFromEditor()">⇩ TRAER DE EDITOR</button>
  <div class="spinner" id="spinner"></div>
  <span id="status-msg"></span>
  <button class="hbtn primary" id="btn-save" onclick="saveLibrary()">💾 GUARDAR</button>
</header>

<div class="layout">

  <!-- ── Symbols sidebar ── -->
  <div class="symbols-panel">
    <div class="panel-title">// símbolos</div>
    <div class="symbols-list" id="symbols-list"></div>
    <div class="symbols-footer">
      <button class="add-btn" id="btn-new-symbol" onclick="newSymbol()">+ NUEVO OBJETO</button>
    </div>
  </div>

  <!-- ── Symbol editor ── -->
  <div class="symbol-editor" id="symbol-editor">
    <div class="empty-state" id="lib-empty-state">Seleccioná o creá un símbolo para empezar</div>
  </div>

  <!-- ── Preview + YAML ── -->
  <div class="preview-yaml">
    <div class="preview-area">
      <div id="preview-svg"></div>
    </div>
    <div class="yaml-area">
      <div class="yaml-area-header" id="lib-yaml-title">// yaml del símbolo actual</div>
      <textarea id="yaml-output" readonly></textarea>
    </div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────
  let libraryData = null;      // { library: { name, symbols: [...] } }
  let currentLibFile = null;
  let currentSymbolIdx = -1;
  let currentShapeIdx = -1;
  let previewTimer = null;

  const SHAPE_TYPES = ["circle", "square", "rectangle", "line", "arc", "text", "image", "symbol"];

  // ── Init ───────────────────────────────────────────────────────
  async function init() {
    await loadLibraryList();
  }

  async function loadLibraryList() {
    const res = await fetch('/api/libraries');
    const data = await res.json();
    const sel = document.getElementById('lib-select');
    sel.innerHTML = data.libraries.map(f => `<option value="${f}">${f}</option>`).join('');
    if (data.libraries.length > 0) {
      sel.value = data.libraries[0];
      await loadLibrary(data.libraries[0]);
    }
  }

  async function onLibrarySelect() {
    const file = document.getElementById('lib-select').value;
    await loadLibrary(file);
  }

  async function loadLibrary(filename) {
    setStatus(t('library_studio.status.loading'));
    const res = await fetch(`/api/library/${filename}`);
    if (!res.ok) {
      setStatus('error al cargar');
      return;
    }
    libraryData = await res.json();
    if (!libraryData.library) libraryData.library = { name: filename.replace(/\.ya?ml$/, ''), symbols: [] };
    if (!libraryData.library.symbols) libraryData.library.symbols = [];
    currentLibFile = filename;
    currentSymbolIdx = -1;
    currentShapeIdx = -1;
    renderSymbolsList();
    renderSymbolEditor();
    setStatus('');
  }

  function setStatus(msg) {
    document.getElementById('status-msg').textContent = msg;
  }

  // ── New library / symbol ────────────────────────────────────────
  function newLibrary() {
    const name = prompt(t('library_studio.new_library_prompt') || 'New library name (without .yaml):');
    if (!name) return;
    const filename = name.endsWith('.yaml') ? name : name + '.yaml';
    libraryData = { library: { name: name, symbols: [] } };
    currentLibFile = filename;
    currentSymbolIdx = -1;
    currentShapeIdx = -1;

    const sel = document.getElementById('lib-select');
    if (![...sel.options].some(o => o.value === filename)) {
      const opt = document.createElement('option');
      opt.value = filename;
      opt.textContent = filename;
      sel.appendChild(opt);
    }
    sel.value = filename;

    renderSymbolsList();
    renderSymbolEditor();
    setStatus(t('library_studio.status.new_unsaved'));
  }

  function newSymbol() {
    if (!libraryData) return;
    const name = prompt(t('library_studio.new_symbol_prompt') || 'New symbol name:');
    if (!name) return;  // cancelado o vacío
    libraryData.library.symbols.push({
      name, width: 60, height: 60, keep_ratio: false,
      shapes: [{ type: 'circle', x: 0, y: 0, width: 60, height: 60, line_color: 'inherit', fill_color: 'inherit' }]
    });
    currentSymbolIdx = libraryData.library.symbols.length - 1;
    currentShapeIdx = 0;
    renderSymbolsList();
    renderSymbolEditor();
  }

  // ── Symbols list ─────────────────────────────────────────────────
  function renderSymbolsList() {
    const list = document.getElementById('symbols-list');
    if (!libraryData || !libraryData.library.symbols.length) {
      list.innerHTML = `<div style="padding:16px;font-family:var(--mono);font-size:10px;color:var(--text-dim);">${t("library_studio.shape_types.no_symbols")}</div>`;
      return;
    }
    list.innerHTML = libraryData.library.symbols.map((s, i) => `
      <div class="symbol-item ${i === currentSymbolIdx ? 'active' : ''}" onclick="selectSymbol(${i})">
        <span>◈ ${s.name}</span>
      </div>
    `).join('');
  }

  function selectSymbol(idx) {
    currentSymbolIdx = idx;
    currentShapeIdx = libraryData.library.symbols[idx].shapes.length ? 0 : -1;
    renderSymbolsList();
    renderSymbolEditor();
  }

  function deleteSymbol(idx) {
    if (!confirm(t('library_studio.actions.confirm_delete') || 'Delete this symbol?')) return;
    libraryData.library.symbols.splice(idx, 1);
    currentSymbolIdx = -1;
    currentShapeIdx = -1;
    renderSymbolsList();
    renderSymbolEditor();
  }

  // ── Symbol editor (common fields + shapes list) ──────────────────
  function renderSymbolEditor() {
    const editor = document.getElementById('symbol-editor');
    if (currentSymbolIdx < 0 || !libraryData) {
      editor.innerHTML = `<div class="empty-state" id="lib-empty-state">${t('library_studio.shape_types.empty_state')}</div>`;
      document.getElementById('preview-svg').innerHTML = '';
      document.getElementById('yaml-output').value = '';
      return;
    }

    const sym = libraryData.library.symbols[currentSymbolIdx];

    editor.innerHTML = `
      <div class="section">
        <div class="section-title">
          <span>${t("library_studio.sections.object")}</span>
          <span style="cursor:pointer;color:var(--accent2);" onclick="deleteSymbol(${currentSymbolIdx})">${t("library_studio.actions.delete_symbol")}</span>
        </div>
        <div class="field"><label>NAME</label>
          <input type="text" id="sym-name" value="${sym.name}" onchange="updateSymbolField('name', this.value)"/></div>
        <div class="field-row">
          <div class="field"><label>WIDTH (px)</label>
            <input type="number" id="sym-width" value="${sym.width}" min="1" onchange="updateSymbolField('width', parseFloat(this.value))"/></div>
          <div class="field"><label>HEIGHT (px)</label>
            <input type="number" id="sym-height" value="${sym.height}" min="1" onchange="updateSymbolField('height', parseFloat(this.value))"/></div>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="sym-keep-ratio" ${sym.keep_ratio ? 'checked' : ''} onchange="updateSymbolField('keep_ratio', this.checked)"/>
          <label for="sym-keep-ratio">KEEP RATIO</label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">${t("library_studio.sections.preview_colors")}</div>
        <div class="field-row">
          <div class="field"><label>LINE COLOR</label>
            <input type="color" id="preview-line-color" value="#00d4ff" onchange="refreshPreview()"/></div>
          <div class="field"><label>FILL COLOR</label>
            <input type="color" id="preview-fill-color" value="#0a0a1a" onchange="refreshPreview()"/></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>${t("library_studio.sections.shapes", {n: sym.shapes.length})}</span>
        </div>
        <div class="shapes-list" id="shapes-list"></div>
        <select class="add-btn" style="margin-top:4px;" onchange="addShape(this.value); this.value='';">
          <option value="">${t("library_studio.shape_types.add_placeholder")}</option>
          ${SHAPE_TYPES.map(st => `<option value="${st}">${st}</option>`).join('')}
        </select>
        <div id="shape-detail-container"></div>
      </div>
    `;

    renderShapesList();
    renderShapeDetail();
    refreshPreview();
  }

  function updateSymbolField(field, value) {
    libraryData.library.symbols[currentSymbolIdx][field] = value;
    renderSymbolsList();
    refreshPreview();
  }

  // ── Shapes list within symbol ─────────────────────────────────────
  function renderShapesList() {
    const sym = libraryData.library.symbols[currentSymbolIdx];
    const list = document.getElementById('shapes-list');
    list.innerHTML = sym.shapes.map((sh, i) => `
      <div class="shape-chip ${i === currentShapeIdx ? 'active' : ''}" onclick="selectShape(${i})">
        <span class="stype">${sh.type}</span>
        <span>${sh.type === 'text' ? (sh.text || '') : ''}</span>
        <span class="sdup" onclick="event.stopPropagation(); duplicateShape(${i})" title="Duplicar">⎘</span>
        <span class="sremove" onclick="event.stopPropagation(); removeShape(${i})">✕</span>
      </div>
    `).join('');
  }

  function duplicateShape(idx) {
    const sym = libraryData.library.symbols[currentSymbolIdx];
    const original = sym.shapes[idx];
    const copy = JSON.parse(JSON.stringify(original));
    // Pequeño offset para que no quede exactamente superpuesto
    if ('x' in copy) copy.x = (copy.x || 0) + 10;
    if ('y' in copy) copy.y = (copy.y || 0) + 10;
    if ('cx' in copy) copy.cx = (copy.cx || 0) + 10;
    if ('cy' in copy) copy.cy = (copy.cy || 0) + 10;
    sym.shapes.splice(idx + 1, 0, copy);
    currentShapeIdx = idx + 1;
    renderShapesList();
    renderShapeDetail();
    refreshPreview();
  }

  function selectShape(idx) {
    currentShapeIdx = idx;
    renderShapesList();
    renderShapeDetail();
  }

  function addShape(type) {
    if (!type) return;
    const sym = libraryData.library.symbols[currentSymbolIdx];
    const base = { type, x: 0, y: 0 };
    let extra = {};
    if (type === 'circle' || type === 'square' || type === 'rectangle') {
      extra = { width: 30, height: 30, line_color: 'inherit', fill_color: 'inherit', fill_transparency: 'inherit' };
    } else if (type === 'line') {
      extra = { cx: 0, cy: 0, length: 30, angle: 0, line_color: 'inherit', stroke_width: 1.5 };
      delete base.x; delete base.y;
    } else if (type === 'arc') {
      extra = { width: 30, height: 30, arc_length: 90, angle: 0, pizza: false,
                line_color: 'inherit', fill_color: 'inherit', fill_transparency: 'inherit', stroke_width: 1.5 };
    } else if (type === 'text') {
      extra = { text: 'X', font: 'monospace', font_size: 12, line_color: 'inherit' };
    } else if (type === 'image') {
      extra = { width: 30, height: 30, image: 'icono.png' };
    } else if (type === 'symbol') {
      extra = { symbol: '', width: 30, height: 30, line_color: 'inherit', fill_color: 'inherit', fill_transparency: 'inherit' };
    }
    sym.shapes.push({ ...base, ...extra });
    currentShapeIdx = sym.shapes.length - 1;
    renderShapesList();
    renderShapeDetail();
    refreshPreview();
  }

  function removeShape(idx) {
    const sym = libraryData.library.symbols[currentSymbolIdx];
    sym.shapes.splice(idx, 1);
    if (currentShapeIdx >= sym.shapes.length) currentShapeIdx = sym.shapes.length - 1;
    renderShapesList();
    renderShapeDetail();
    refreshPreview();
  }

  // ── Shape detail (specific fields per type) ───────────────────────
  function renderShapeDetail() {
    const container = document.getElementById('shape-detail-container');
    if (!container) return;
    if (currentShapeIdx < 0) { container.innerHTML = ''; return; }

    const sym = libraryData.library.symbols[currentSymbolIdx];
    const sh = sym.shapes[currentShapeIdx];

    const colorInheritField = (label, key) => `
      <div class="field"><label>${label}</label>
        <div class="field-row">
          <select onchange="setShapeField('${key}', this.value === '__custom__' ? (document.getElementById('${key}-custom').value) : this.value)"
                  style="flex:0 0 90px;">
            <option value="inherit" ${sh[key] === 'inherit' ? 'selected' : ''}>inherit</option>
            <option value="none" ${sh[key] === 'none' ? 'selected' : ''}>none</option>
            <option value="__custom__" ${sh[key] && sh[key] !== 'inherit' && sh[key] !== 'none' ? 'selected' : ''}>fijo...</option>
          </select>
          <input type="color" id="${key}-custom"
                 value="${sh[key] && sh[key].startsWith && sh[key].startsWith('#') ? sh[key] : '#ffffff'}"
                 onchange="setShapeField('${key}', this.value)"
                 style="flex:1;"/>
        </div></div>`;

    const transparencyField = (label, key) => {
      const isInherit = sh[key] === 'inherit' || sh[key] === undefined;
      const numVal = isInherit ? 0 : sh[key];
      return `
      <div class="field"><label>${label}</label>
        <div class="field-row">
          <select onchange="setShapeField('${key}', this.value === 'inherit' ? 'inherit' : parseFloat(document.getElementById('${key}-num').value))"
                  style="flex:0 0 90px;">
            <option value="inherit" ${isInherit ? 'selected' : ''}>inherit</option>
            <option value="fixed" ${!isInherit ? 'selected' : ''}>fijo</option>
          </select>
          <input type="number" id="${key}-num" min="0" max="100" value="${numVal}"
                 onchange="setShapeField('${key}', parseFloat(this.value))"
                 style="flex:1;" ${isInherit ? 'disabled' : ''}/>
        </div></div>`;
    };

    const subtractToggle = () => `
      <div class="toggle-row">
        <input type="checkbox" ${sh.subtract ? 'checked' : ''} onchange="setShapeField('subtract', this.checked)"/>
        <label>${t("library_studio.fields.subtract")}</label></div>`;

    let fields = `<div class="shape-detail">`;
    fields += subtractToggle();
    fields += `<div class="field-row">
      <div class="field"><label>X</label><input type="number" value="${sh.x ?? 0}" onchange="setShapeField('x', parseFloat(this.value))"/></div>
      <div class="field"><label>Y</label><input type="number" value="${sh.y ?? 0}" onchange="setShapeField('y', parseFloat(this.value))"/></div>
    </div>`;

    if (['circle', 'square', 'rectangle', 'arc', 'image', 'symbol'].includes(sh.type)) {
      fields += `<div class="field-row">
        <div class="field"><label>WIDTH</label><input type="number" value="${sh.width ?? 30}" onchange="setShapeField('width', parseFloat(this.value))"/></div>
        <div class="field"><label>HEIGHT</label><input type="number" value="${sh.height ?? 30}" onchange="setShapeField('height', parseFloat(this.value))"/></div>
      </div>`;
    }

    if (sh.type === 'line') {
      fields += `<div class="field-row">
        <div class="field"><label>CX</label><input type="number" value="${sh.cx ?? 0}" onchange="setShapeField('cx', parseFloat(this.value))"/></div>
        <div class="field"><label>CY</label><input type="number" value="${sh.cy ?? 0}" onchange="setShapeField('cy', parseFloat(this.value))"/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>LENGTH</label><input type="number" value="${sh.length ?? 30}" onchange="setShapeField('length', parseFloat(this.value))"/></div>
        <div class="field"><label>ANGLE</label><input type="number" value="${sh.angle ?? 0}" onchange="setShapeField('angle', parseFloat(this.value))"/></div>
      </div>
      <div class="field"><label>STROKE WIDTH</label><input type="number" value="${sh.stroke_width ?? 1.5}" step="0.5" onchange="setShapeField('stroke_width', parseFloat(this.value))"/></div>
      ${colorInheritField('LINE COLOR', 'line_color')}
      <div class="toggle-row">
        <input type="checkbox" ${sh.curly ? 'checked' : ''} onchange="setShapeField('curly', this.checked); renderShapeDetail();"/>
        <label>${t("library_studio.fields.curly")}</label></div>
      ${sh.curly ? `
      <div class="field-row">
        <div class="field"><label>WAVE LENGTH</label><input type="number" value="${sh.wave_length ?? 20}" min="2" onchange="setShapeField('wave_length', parseFloat(this.value))"/></div>
        <div class="field"><label>WAVE HEIGHT</label><input type="number" value="${sh.wave_height ?? 6}" min="1" onchange="setShapeField('wave_height', parseFloat(this.value))"/></div>
      </div>` : ''}`;
    }

    if (sh.type === 'arc') {
      fields += `<div class="field-row">
        <div class="field"><label>ARC LENGTH</label><input type="number" value="${sh.arc_length ?? 90}" onchange="setShapeField('arc_length', parseFloat(this.value))"/></div>
        <div class="field"><label>ANGLE</label><input type="number" value="${sh.angle ?? 0}" onchange="setShapeField('angle', parseFloat(this.value))"/></div>
      </div>
      <div class="field"><label>STROKE WIDTH</label><input type="number" value="${sh.stroke_width ?? 1.5}" step="0.5" onchange="setShapeField('stroke_width', parseFloat(this.value))"/></div>
      <div class="toggle-row">
        <input type="checkbox" ${sh.pizza ? 'checked' : ''} onchange="setShapeField('pizza', this.checked)"/>
        <label>${t("library_studio.fields.pizza")}</label></div>
      ${colorInheritField('LINE COLOR', 'line_color')}
      ${colorInheritField('FILL COLOR', 'fill_color')}
      ${transparencyField('FILL TRANSPARENCY', 'fill_transparency')}`;
    }

    if (['circle', 'square', 'rectangle'].includes(sh.type)) {
      fields += colorInheritField('LINE COLOR', 'line_color');
      fields += colorInheritField('FILL COLOR', 'fill_color');
      fields += transparencyField('FILL TRANSPARENCY', 'fill_transparency');
    }

    if (sh.type === 'text') {
      fields += `<div class="field"><label>${t("library_studio.fields.text")}</label><input type="text" value="${sh.text ?? ''}" oninput="setShapeField('text', this.value)"/></div>
      <div class="field-row">
        <div class="field"><label>FONT</label><input type="text" value="${sh.font ?? 'monospace'}" onchange="setShapeField('font', this.value)"/></div>
        <div class="field"><label>FONT SIZE</label><input type="number" value="${sh.font_size ?? 12}" onchange="setShapeField('font_size', parseFloat(this.value))"/></div>
      </div>
      ${colorInheritField('LINE COLOR', 'line_color')}`;
    }

    if (sh.type === 'image') {
      fields += `<div class="field"><label>${t("library_studio.fields.file_images")}</label><input type="text" value="${sh.image ?? ''}" oninput="setShapeField('image', this.value)"/></div>`;
    }

    if (sh.type === 'symbol') {
      const otherSymbols = libraryData.library.symbols.filter((s, i) => i !== currentSymbolIdx).map(s => s.name);
      fields += `<div class="field"><label>${t("library_studio.fields.symbol_ref")}</label>
        <select onchange="setShapeField('symbol', this.value)">
          <option value="">${t("library_studio.fields.symbol_choose")}</option>
          ${otherSymbols.map(n => `<option value="${n}" ${sh.symbol === n ? 'selected' : ''}>${n}</option>`).join('')}
        </select></div>
        ${colorInheritField('LINE COLOR', 'line_color')}
        ${colorInheritField('FILL COLOR', 'fill_color')}
        ${transparencyField('FILL TRANSPARENCY', 'fill_transparency')}`;
    }

    fields += `</div>`;
    container.innerHTML = fields;
  }

  function setShapeField(key, value) {
    const sym = libraryData.library.symbols[currentSymbolIdx];
    sym.shapes[currentShapeIdx][key] = value;
    renderShapesList();
    refreshPreview();
  }

  // ── Preview ───────────────────────────────────────────────────────
  async function refreshPreview() {
    if (currentSymbolIdx < 0) return;
    const sym = libraryData.library.symbols[currentSymbolIdx];
    const spinner = document.getElementById('spinner');
    spinner.style.display = 'block';

    const lineColorEl = document.getElementById('preview-line-color');
    const fillColorEl = document.getElementById('preview-fill-color');

    try {
      const payload = {
        symbol: sym,
        preview_size: 140,
        line_color: lineColorEl ? lineColorEl.value : '#00d4ff',
        fill_color: fillColorEl ? fillColorEl.value : '#0a0a1a',
        fill_transparency: 0,
      };
      const res = await fetch('/api/library/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        const svg = await res.text();
        document.getElementById('preview-svg').innerHTML = svg;
      } else {
        const err = await res.json().catch(() => ({ detail: 'error desconocido' }));
        document.getElementById('preview-svg').innerHTML =
          `<div class="empty-state" style="color:#ff6b35;">⚠ Error de preview<br/><span style="font-size:9px;">${err.detail || ''}</span></div>`;
        console.error('Preview error:', err);
      }
    } catch (e) {
      document.getElementById('preview-svg').innerHTML =
        `<div class="empty-state" style="color:#ff6b35;">⚠ Error de red</div>`;
      console.error('Preview fetch error:', e);
    }
    spinner.style.display = 'none';

    updateYamlOutput();
  }

  function updateYamlOutput() {
    if (currentSymbolIdx < 0) return;
    const sym = libraryData.library.symbols[currentSymbolIdx];
    const lines = [`    - name: ${sym.name}`, `      width: ${sym.width}`, `      height: ${sym.height}`];
    if (sym.keep_ratio) lines.push(`      keep_ratio: true`);
    lines.push(`      shapes:`);
    sym.shapes.forEach(sh => {
      const entries = Object.entries(sh);
      entries.forEach(([k, v], i) => {
        const prefix = i === 0 ? `        - ` : `          `;
        if (typeof v === 'string') lines.push(`${prefix}${k}: ${isNaN(v) || v === '' ? `"${v}"` : v}`);
        else lines.push(`${prefix}${k}: ${v}`);
      });
    });
    document.getElementById('yaml-output').value = lines.join('\n');
  }

  // ── Save ──────────────────────────────────────────────────────────
  async function saveLibrary() {
    if (!libraryData || !currentLibFile) return;
    const btn = document.getElementById('btn-save');
    setStatus(t('library_studio.status.saving'));
    try {
      const res = await fetch(`/api/library/${currentLibFile}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(libraryData),
      });
      if (!res.ok) {
        const err = await res.json();
        setStatus(t('library_studio.status.save_error'));
        alert(t('library_studio.editor.save_error_detail') + (err.detail || 'unknown'));
        return;
      }
      btn.textContent = t('library_studio.saved') || '✓ GUARDADO';
      btn.classList.add('saved');
      setStatus('');
      setTimeout(() => { btn.textContent = t('library_studio.save') || '💾 GUARDAR'; btn.classList.remove('saved'); }, 2000);

      // Solo refrescamos el <select> con la lista actualizada de archivos,
      // sin recargar ni perder el estado de edición actual.
      const listRes = await fetch('/api/libraries');
      const listData = await listRes.json();
      const sel = document.getElementById('lib-select');
      const prevValue = currentLibFile;
      sel.innerHTML = listData.libraries.map(f => `<option value="${f}">${f}</option>`).join('');
      sel.value = prevValue;
    } catch (e) {
      setStatus(t('library_studio.status.network_error'));
    }
  }

  async function openEditor() {
    if (!currentLibFile) return;
    setStatus(t('library_studio.status.opening_editor'));
    try {
      const res = await fetch(`/api/library/${currentLibFile}/editor/open`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'error desconocido' }));
        if (res.status === 404) {
          alert(t('library_studio.editor.not_saved_yet'));
        } else {
          alert(t('library_studio.editor.error_opening') + (err.detail || 'unknown'));
        }
        setStatus('');
        return;
      }
      const data = await res.json();
      window.open(data.url, '_blank');
      setStatus('');
    } catch (e) {
      alert(t('library_studio.editor.connect_error'));
      setStatus(t('library_studio.status.network_error'));
    }
  }

  async function loadFromEditor() {
    if (!currentLibFile) return;
    if (!confirm(t("library_studio.editor.confirm_save", {file: currentLibFile}))) {
      return;
    }
    setStatus(t('library_studio.status.from_editor'));
    try {
      const res = await fetch(`/api/library/${currentLibFile}/editor/save`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'error desconocido' }));
        if (res.status === 404) {
          alert(t('library_studio.editor.pad_not_found'));
        } else {
          alert(t('library_studio.editor.error_saving') + (err.detail || 'unknown'));
        }
        setStatus('');
        return;
      }
      // Recargar la librería en memoria con el contenido recién guardado
      await loadLibrary(currentLibFile);
      setStatus(t('library_studio.status.updated'));
    } catch (e) {
      alert(t('library_studio.editor.connect_error'));
      setStatus(t('library_studio.status.network_error'));
    }
  }

  // ── i18n ────────────────────────────────────────────────────────
  let _i18n = {};

  async function loadI18n() {
    try {
      const res = await fetch('/api/i18n');
      if (res.ok) _i18n = await res.json();
    } catch (e) {
      console.warn('i18n load failed, using keys as fallback');
    }
  }

  function t(path, vars = {}) {
    // Navega el objeto por "a.b.c" y devuelve el string
    const val = path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), _i18n);
    if (!val) return path; // fallback: la clave en sí
    return Object.entries(vars).reduce((s, [k, v]) => s.replace(`{${k}}`, v), val);
  }

  function applyLibraryStudioI18n() {
    const logo = document.querySelector('.logo');
    if (logo) logo.textContent = t('app.library_studio_name');
    const sub = document.querySelector('.logo-sub');
    if (sub) sub.textContent = t('app.library_studio_tagline');

    const btnMap = {
      'btn-new-library':  t('library_studio.new_library'),
      'btn-editor':       t('library_studio.editor_btn'),
      'btn-from-editor':  t('library_studio.from_editor_btn'),
      'btn-save':         t('library_studio.save'),
      'btn-new-symbol':   t('library_studio.actions.new_symbol_btn'),
      'lib-empty-state':  t('library_studio.shape_types.empty_state'),
      'lib-yaml-title':   t('library_studio.sections.yaml'),
    };
    Object.entries(btnMap).forEach(([id, text]) => {
      const el = document.getElementById(id);
      if (el && text && !text.includes('.')) el.textContent = text;
    });

    const panelTitle = document.querySelector('.panel-title');
    if (panelTitle) panelTitle.textContent = t('library_studio.sections.symbols');
  }

  async function initLibraryStudio() {
    await loadI18n();
    applyLibraryStudioI18n();
    await loadLibraryList();
  }

  initLibraryStudio();
</script>
</body>
</html>
